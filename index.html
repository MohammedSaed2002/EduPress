<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPress</title>
      <link href="./assets/css/output.css" rel="stylesheet">

</head>
<body>

<!-- Navbar -->
<header class="bg-white shadow-sm">

  <div class="max-w-[1290px] mx-auto px-6">

    <div class="h-[72px] flex items-center justify-between">

      <!-- Logo -->
      <a href="#" class="flex items-center">
        <img src="./assets/imgs/LOGO.svg" 
             alt="EduPress Logo"
             class="h-8 w-auto">
      </a>

      <!-- Links -->
      <nav class="hidden lg:flex items-center gap-8 font-medium text-[15px]">
        <a href="#" class="text-orange-500">Home</a>
        <a href="#" class="hover:text-orange-500 transition">Courses</a>
        <a href="#" class="hover:text-orange-500 transition">Blog</a>
        <a href="#" class="hover:text-orange-500 transition">Page</a>
        <a href="#" class="hover:text-orange-500 transition">LearnPress Add-On</a>
        <a href="#" class="hover:text-orange-500 transition">Premium Theme</a>
      </nav>

      <!-- Right Side -->
      <div class="flex items-center gap-6">

        <span class="hidden md:block hover:text-orange-500 cursor-pointer text-[15px]">
          Login / Register
        </span>

        <!-- Search Icon -->
        <img src="./assets/imgs/Search.svg"
             alt="search"
             class="w-5 h-5 cursor-pointer hover:scale-110 transition">

      </div>

    </div>

  </div>

</header>




<!-- Hero Section -->
<section class="relative min-h-screen bg-gradient-to-r from-[#f8e7b6] via-[#d7f0d3] to-[#c4ebe4] overflow-hidden">

  <!-- Background Big Text -->
  <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
    <h1 class="text-[120px] lg:text-[180px] font-extrabold text-white opacity-10 leading-none text-center select-none">
      ONLINE <br> SCHOOL
    </h1>
  </div>

  <div class="container mx-auto px-6 h-screen grid lg:grid-cols-2 items-center relative z-10">

    <!-- Left Content -->
    <div class="max-w-[520px] ml-[60px] lg:ml-[120px]">

      <h2 class="text-4xl lg:text-5xl font-bold leading-tight mb-6">
        Build Skills With <br>
        Online Course
      </h2>

      <p class="text-gray-600 mb-8 text-lg leading-relaxed">
        We denounce with righteous indignation and dislike men who are so
        beguiled and demoralized that cannot trouble.
      </p>

      <button class="bg-orange-500 text-white px-8 py-3 rounded-full font-medium hover:bg-orange-600 transition duration-300 shadow-lg">
        Posts Comment
      </button>

    </div>

  <!-- Right Image -->
<div class="relative h-full flex items-end justify-end">

  <!-- Background Shape (ONLINE SCHOOL SVG) -->
  <img src="assets/imgs/scl 1.svg"
       alt=""
       class="absolute top-1/2 right-0 -translate-y-1/2 w-[820px] max-w-none z-0" />

  <!-- Main Girl Image -->
  <img src="assets/imgs/beautiful-student-girl-wearing-backpack-holding-notebook-isolated-white-background 1.svg"
       alt="student"
       class="h-full object-contain relative z-10" />

</div>



  </div>

</section>



</body>
</html>
